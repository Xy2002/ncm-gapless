name: macOS patch checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check maintenance, signing and portable packages
        run: |
          python -m unittest discover -s tests -p 'test_macos*.py'
          python -m unittest discover -s tests -p 'test_build_*.py'
          node --test tests/client-adapter.test.js tests/controller.test.cjs tests/aac-timing.test.cjs tests/verify-disable.test.js
